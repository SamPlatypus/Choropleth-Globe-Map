plugins {
    id "com.android.application"
}

android {
    namespace "com.samplatypus.offline3dchoroplethglobe"
    compileSdk 35

    defaultConfig {
        applicationId "com.samplatypus.offline3dchoroplethglobe"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            storeFile file("choropleth.keystore")
            storePassword "choropleth"
            keyAlias "choropleth"
            keyPassword "choropleth"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
}
